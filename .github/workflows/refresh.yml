name: Refresh macro data

on:
  schedule:
    # FRED publishes day D's H.15 yields on day D+1, around 15:00-16:00 UTC.
    # Two slots because GitHub's scheduler drifts by hours: if the evening run
    # slips past midnight it lands BEFORE that day's FRED update and re-commits
    # stale data, which is exactly what happened on 1 Sep.
    - cron: "30 17 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from FRED and rebuild index.html
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/fetch_data.py

      - name: Commit if anything moved
        run: |
          git config user.name  "macro-soundings-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- index.html; then
            echo "No change in the numbers today."
          else
            git add index.html
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
